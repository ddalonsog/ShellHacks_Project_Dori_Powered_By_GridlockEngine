services:
  db:
    image: postgis/postgis:15-3.3
    container_name: gridlock_db
    restart: always
    environment:
      POSTGRES_DB: gridlock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: